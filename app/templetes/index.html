<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HealthTech PHI/PII Redaction Pipeline</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#f4f7fa;
}

.card{
border-radius:15px;
box-shadow:0 0 15px rgba(0,0,0,.15);
}

textarea{
height:180px;
}

.result{
background:white;
padding:15px;
border-radius:10px;
min-height:150px;
}

</style>

</head>

<body>

<div class="container mt-5">

<div class="card p-4">

<h2 class="text-center mb-4">
🏥 HealthTech PHI/PII Redaction Pipeline
</h2>

<form action="/process" method="post" enctype="multipart/form-data">

<div class="mb-3">

<label class="form-label">

Patient Text

</label>

<textarea
class="form-control"
name="text"
placeholder="Paste patient report here..."
></textarea>

</div>

<div class="text-center mb-3">

<h5>OR</h5>

</div>

<div class="mb-3">

<label class="form-label">

Upload PDF

</label>

<input
type="file"
name="pdf"
class="form-control">

</div>

<div class="text-center">

<button class="btn btn-primary btn-lg">

Process Report

</button>

</div>

</form>

<hr>

<div class="row">

<div class="col-md-6">

<h5>Original Text</h5>

<div class="result">

{{ original }}

</div>

</div>

<div class="col-md-6">

<h5>Protected Output</h5>

<div class="result">

{{ redacted }}

</div>

</div>

</div>

</div>

</div>

</body>
</html>
